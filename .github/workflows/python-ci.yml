name: Python SDK
on:
  push:
    branches: [main]
    paths: ['packages/python/**', 'packages/node/openapi/**', '.github/workflows/python-*.yml']
  pull_request:
    paths: ['packages/python/**', 'packages/node/openapi/**', '.github/workflows/python-*.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: packages/python
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        os: [ubuntu-latest]
        include:
          - {python: '3.13', os: windows-latest}
          - {python: '3.13', os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          python scripts/generate.py --check
          python -m mypy src/insidedm examples
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'build==1.6.1' 'twine==7.0.0'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_release.py
      - name: Install and use wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/insidedm-wheel"
          "$RUNNER_TEMP/insidedm-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/insidedm-wheel/bin/python" -I -c 'from insidedm.testing import create_test_client; from insidedm.types import inputs, responses; c=create_test_client(); assert c.workspace.get().data.id; c.close()'
      - name: Build and use source archive independently
        run: |
          python -m venv "$RUNNER_TEMP/insidedm-sdist"
          "$RUNNER_TEMP/insidedm-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/insidedm-sdist/bin/python" -I -c 'from insidedm.testing import create_test_client; c=create_test_client(); assert c.workspace.get().data.id; c.close()'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: packages/python/dist/*
          if-no-files-found: error
          retention-days: 14
