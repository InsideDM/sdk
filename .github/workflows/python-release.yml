name: Publish Python SDK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-python-sdk
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/python-ci.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/insidedm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist/
      - name: Publish the exact checked distributions with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
