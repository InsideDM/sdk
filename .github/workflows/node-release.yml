name: Publish Node SDK
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
defaults:
  run:
    working-directory: packages/node
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:release
      - name: Publish prerelease or stable version
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [[ "$version" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance --tag latest
          fi
