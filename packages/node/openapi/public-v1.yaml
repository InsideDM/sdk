{"openapi":"3.1.1","info":{"title":"InsideDM Public API","version":"1","summary":"Read workspace data, send notifications and track operations with an API key.","description":"Access to one InsideDM workspace, authenticated with an API key\ncreated in Settings › Developer. Contact custom fields, messaging and operation\ncontrols use their canonical shared owners. Recovery lookup uses a read-only\nPOST to keep the original key outside URLs. Every response is\nJSON; every failure is `application/problem+json` with one of the fifteen\ncodes in `ProblemCode`.\n\nWebhooks tell you that something changed (a thin event: identifiers only);\nyou then read the change here, under your key's scopes.\n\nGuides: `docs/public-api/authentication.md`, `pagination.md`, `errors.md`,\n`webhooks.md`.\n\nBase URL: the API's hostname is shown in Settings › Developer. This\ndocument lists no `servers` until that hostname resolves publicly.\n\nThis document is written by hand and checked against the routes the API\nactually serves (`apps/public-api/src/openapi.parity.test.ts`).\n","license":{"name":"MIT","identifier":"MIT"}},"security":[{"apiKey":[]}],"tags":[{"name":"Workspace"},{"name":"Contacts"},{"name":"Conversations"},{"name":"Messages"},{"name":"Orders"},{"name":"Shipments"},{"name":"Operations"},{"name":"Events"},{"name":"Platform"},{"name":"Usage"},{"name":"Flows"}],"paths":{"/api/v1/dashboard/{businessId}/analytics":{"get":{"operationId":"getBusinessAnalytics","tags":["Analytics"],"summary":"Read the business analytics report for a calendar window","description":"Requires analytics.read. The same report and endpoint used by the dashboard,\nwith calendar windows resolved in the business timezone. Includes observed\nrevenue, conversation outcomes, reply times and customer signals. Missing\ncomparison evidence remains explicit; figures do not establish causality.\nCustom ranges require start and end dates, inclusive, and cannot exceed\nthe native analytics retention and range limits.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"in":"query","name":"channel","schema":{"type":"string","enum":["all","instagram","whatsapp"]}},{"in":"query","name":"range","schema":{"type":"string","enum":["week","month","quarter","custom"]}},{"in":"query","name":"start","schema":{"type":"string","format":"date"}},{"in":"query","name":"end","schema":{"type":"string","format":"date"}}],"responses":{"200":{"description":"Native analytics report with explicit window and comparison evidence","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BusinessAnalyticsReport"}}}},"default":{"$ref":"#/components/responses/Problem"}}}},"/api/v1/flows/{businessId}/recipes":{"get":{"operationId":"listEventBindings","tags":["Events"],"summary":"Discover active published from-system flows and input requirements","description":"Requires events.write. Uses the native UI flow-list endpoint with a\nminimized event_bindings view. Returns mapped input pointers/types and\nthe current publication ID, without graphs, URLs, secrets or run data.\nendpointConfigured reflects the existing start endpoint only, not send\neligibility or a reservation. Published mappings and current authority\nare checked again on intake. Pages scan a bounded native keyset; an\nempty filtered page can still have a continuation cursor. Each page\nscans at most ten publications to bound worst-case mapped-field sizes.\nReuse the\nsame limit and cursor until nextCursor is null.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"view","in":"query","required":true,"schema":{"type":"string","const":"event_bindings"}},{"$ref":"#/components/parameters/Limit"},{"$ref":"#/components/parameters/Cursor"}],"responses":{"200":{"description":"Current published event bindings","content":{"application/json":{"schema":{"$ref":"#/components/schemas/EventBindingPage"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/automation-governance/{businessId}/recipes/{recipeId}":{"get":{"operationId":"getFlowGovernance","tags":["Flows"],"summary":"Read the native approval and regression policy for a managed flow","description":"Scope flows.read. Uses the existing native governance owner. Returns current revision and open release identity without fixtures, graphs or reviewer identities. No review, publication or policy-change authority is issued.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"view","in":"query","required":true,"schema":{"type":"string","const":"managed"}}],"responses":{"200":{"description":"Current native flow governance rules.","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/FlowGovernanceConfiguration"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/flows/{businessId}/recipes/{recipeId}/graph/simulate":{"post":{"operationId":"simulateFlowDraft","tags":["Flows"],"summary":"Simulate one selected native draft path and record successful coverage","description":"Requires flows.test and the current native test permission. Uses the dashboard simulator, exact draft revision, native prerequisites and bounded runtime variables. Only this connection's managed flows are accessible. A requested path must actually be selected by the inputs. Successful native evaluation records coverage; blocked observations record none. No messages, webhooks, publication or provider execution occur. Returned codes and path/readiness references exclude graph text and variable values. Rerun unchanged inputs after an uncertain response; no idempotency header is accepted.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManagedFlowSimulationInput"}}}},"responses":{"200":{"description":"Native path, readiness and coverage observation","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/FlowDraftSimulation"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}},"x-request-max-bytes":65536}},"/api/v1/automation-governance/{businessId}/recipes/{recipeId}/regression-suites":{"get":{"operationId":"listFlowRegressionSuites","tags":["Flows"],"summary":"Inspect managed regression configuration or release-bound evidence","description":"Requires flows.test and native flows.test permission. Only the original connection's managed deployment is accessible. view=managed requires releaseRequestId and forbids suiteId. view=configuration forbids releaseRequestId and optionally accepts suiteId for one complete suite. Configuration summaries include current draft revision/fingerprint and bounded native structural path/outcome IDs for fixture authoring; unavailable drafts return reasons without paths. Discovery executes nothing and proves no provider readiness. Native snapshots and the evaluator produce evidence; no caller can report a pass, publish or send a message.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"view","in":"query","required":true,"schema":{"type":"string","enum":["managed","configuration"]}},{"name":"releaseRequestId","in":"query","required":false,"schema":{"type":"string","format":"uuid"}},{"name":"suiteId","in":"query","required":false,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Configuration summary, single credential-free fixture suite, or release-bound evidence","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/FlowRegressionCatalog"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}},"post":{"operationId":"saveFlowRegressionSuite","tags":["Flows"],"summary":"Create, update or archive a native regression suite","description":"Requires flows.test and current native test permission. Null suite ID/revision creates; updates use the exact current revision. A required-suite change supersedes open release requests. Fixtures are bounded JSON without credentials. Retries with the original input/key recover the original suite's current state without overwriting later edits. This operation cannot publish or change governance policy.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManagedFlowRegressionSuiteInput"}}}},"responses":{"201":{"description":"Saved suite, or current state of the originally saved suite","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/FlowRegressionSuite"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}},"x-request-max-bytes":65536}},"/api/v1/automation-governance/{businessId}/recipes/{recipeId}/regression-runs":{"post":{"operationId":"runFlowRegression","tags":["Flows"],"summary":"Evaluate one revision-pinned native suite against the retained release candidate","description":"Requires flows.test and native flows.test permission. Only the original connection's managed release and deployment are accessible. Native snapshots and the native evaluator produce evidence; no caller can report passing results, publish a flow or send a message.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManagedFlowRegressionInput"}}}},"responses":{"201":{"description":"Native regression observation without fixtures, secrets or candidate graphs","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/FlowRegressionRun"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}},"x-request-max-bytes":1024}},"/api/v1/automation-governance/{businessId}/recipes/{recipeId}/regression-runs/{runId}":{"get":{"operationId":"getFlowRegressionRun","tags":["Flows"],"summary":"Recover the native result of a release-bound regression run","description":"Requires flows.test and native flows.test permission. Only the original connection's managed release and deployment are accessible. Native snapshots and the native evaluator produce evidence; no caller can report passing results, publish a flow or send a message.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"runId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"view","in":"query","required":true,"schema":{"type":"string","const":"managed"}},{"name":"releaseRequestId","in":"query","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Native regression observation without fixtures, secrets or candidate graphs","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/FlowRegressionRun"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/automation-governance/{businessId}/recipes/{recipeId}/release-requests":{"post":{"operationId":"requestFlowPublication","tags":["Flows"],"summary":"Submit this integration's exact observed managed draft for native human publication","description":"Requires flows.deploy. Uses the editor's compiler, simulation and release owner, including for customized managed drafts. Binds managed/draft/current-publication revisions without overwriting draft content. Creates a native release request, never publishes or approves as a human. Current governance and evidence rules apply. Matching retained intent recovers the same request's current status.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManagedPublicationInput"}}}},"responses":{"201":{"description":"Retained native release request, without publication authority","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/ManagedPublicationRequest"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}},"x-request-max-bytes":2048}},"/api/v1/automation-governance/{businessId}/recipes/{recipeId}/release-requests/{releaseRequestId}":{"get":{"operationId":"getFlowPublicationRequest","tags":["Flows"],"summary":"Observe this integration's managed publication request","description":"Requires flows.deploy and exactly view=managed. Returns current decision revision, native review link and bounded readiness diagnostics, without graphs, evidence content or human identity. Current integration authority and managed-flow ownership remain required.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"releaseRequestId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"view","in":"query","required":true,"schema":{"type":"string","const":"managed"}}],"responses":{"200":{"description":"Current native release request status","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/ManagedPublicationRequest"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/automation-governance/{businessId}/recipes/{recipeId}/release-requests/{releaseRequestId}/withdraw":{"post":{"operationId":"withdrawFlowPublication","tags":["Flows"],"summary":"Withdraw this integration's unpublished release request","description":"Requires flows.deploy and current flows.edit permission. Uses the exact current decision revision and a stable intent key. Closes the original producer-owned pending or approved review, never unpublishes a live version or fabricates a human decision. The same input and key recover the original withdrawal.","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"releaseRequestId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManagedPublicationWithdrawal"}}}},"responses":{"200":{"description":"Withdrawn native release request, or original withdrawal recovery","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/ManagedPublicationRequest"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}},"x-request-max-bytes":1024}},"/api/v1/platform/blueprints/templates":{"get":{"operationId":"listBlueprintTemplates","tags":["Platform"],"summary":"Discover portable template sources and typed customization parameters","description":"Requires platform.blueprints.manage. Global source metadata contains no client resources or credentials. Authoring does not grant merchant access or publish flows.","responses":{"200":{"description":"Bounded supported source catalog","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"type":"array","maxItems":50,"items":{"$ref":"#/components/schemas/PublicBlueprintTemplate"}}}}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/platform/blueprints/versions":{"post":{"operationId":"createBlueprintVersion","tags":["Platform"],"summary":"Create an immutable application-owned portable blueprint version","description":"Requires platform.blueprints.manage. Composes an exact reviewed template\ndigest, typed parameters and explicit client override permissions. No\narbitrary graph, client binding or publication flags are accepted. Repeat\nthe original key/input to recover creation; changed intent conflicts.\nAn existing version under a different key conflicts; read that version.\nMaximum fifty keys and one hundred versions per key/application. No\nmerchant installation, client draft or runtime execution is created.\n","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateBlueprintVersionInput"}}}},"responses":{"201":{"description":"Immutable portable source and its digest","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/PublicBlueprintVersion"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/platform/blueprints/{blueprintKey}/versions":{"get":{"operationId":"listBlueprintVersions","tags":["Platform"],"summary":"List this application's immutable versions for a blueprint key","description":"Requires platform.blueprints.manage. At most one hundred versions, in descending version order. Empty means no version under this application's key.","parameters":[{"name":"blueprintKey","in":"path","required":true,"schema":{"$ref":"#/components/schemas/FlowTemplateIdentifier"}}],"responses":{"200":{"description":"Bounded version history","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"type":"array","maxItems":100,"items":{"$ref":"#/components/schemas/PublicBlueprintVersion"}}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/platform/blueprints/{blueprintKey}/versions/{version}":{"get":{"operationId":"getBlueprintVersion","tags":["Platform"],"summary":"Read one exact application-owned portable version","description":"Requires platform.blueprints.manage. A version is immutable; retrieving it does not grant authority to deploy into a client business.","parameters":[{"name":"blueprintKey","in":"path","required":true,"schema":{"$ref":"#/components/schemas/FlowTemplateIdentifier"}},{"name":"version","in":"path","required":true,"schema":{"type":"string","pattern":"^[1-9]\\d{0,9}$"}}],"responses":{"200":{"description":"Exact version and digest","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/PublicBlueprintVersion"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/flows/{businessId}/recipes/{recipeId}/graph/deployment-preview":{"post":{"operationId":"previewBlueprintUpdate","tags":["Flows"],"summary":"Preview a managed blueprint update while preserving client overrides","description":"Requires flows.deploy. Changes no authoring or publication state. Returns\nan explicit source/default/slot diff and optimistic managed/draft pins.\nManual graph edits, unavailable sources, incompatible overrides and stale\nresource bindings require action. Layout is preserved. A preview is an\nobservation, never execution authority or permission to skip fresh checks.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PreviewBlueprintUpdateInput"}}}},"responses":{"200":{"description":"Current update diff, preserved overrides and readiness","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/BlueprintUpdatePreview"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/flows/{businessId}/recipes/{recipeId}/graph":{"put":{"operationId":"saveFlowDraft","tags":["Flows"],"summary":"Save a managed flow draft or apply a reviewed blueprint update","description":"Requires flows.deploy and the original managed producer. Uses the existing\neditor graph PUT with a managed_draft or blueprint_update command.\nA managed_draft supplies a structurally valid native definition and exact\nmanaged and draft revisions. The native owner stamps flow identity,\nchannel, recipe kind, draft status and next publication version; it retains\nlayout and clears tested coverage only when authoring content changes.\nA damaged native-format draft can be explicitly replaced using its\nobserved positive pins and known valid content. Repairs invalidate old\ncoverage even when restoring a previous declared fingerprint. Unsupported\nbuilder formats require their own authoring owner and are not converted.\nRechecks current source, bindings, original producer and both optimistic\nrevisions. Blueprint updates preserve allowed client overrides and layout,\nblock manual graph overwrite, and append immutable deployment history.\nNever publishes, changes an active publication or alters pinned runs.\nMatching retries return their original historical receipt after later\nedits; they do not reapply a graph. An earlier source can prepare a draft\nrollback, with normal human publication still required.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/ApplyBlueprintUpdateInput"},{"$ref":"#/components/schemas/ManagedFlowDraftSaveInput"}]}}}},"responses":{"200":{"description":"Historical draft-update or unchanged receipt","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"oneOf":[{"$ref":"#/components/schemas/BlueprintUpdateReceipt"},{"$ref":"#/components/schemas/ManagedFlowDraftSaveReceipt"}]}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"503":{"$ref":"#/components/responses/Unavailable"}},"x-request-max-bytes":528384},"get":{"operationId":"getFlowDeployment","tags":["Flows"],"summary":"Read managed import origin or the valid native draft definition","description":"Requires flows.deploy. Uses the existing flow editor GET with a fixed\nmetadata projection by default. The draft view returns the structurally\nvalid native definition with exact revision/fingerprint provenance, without\nexecution or publication. Invalid, incomplete, unsupported or identity-\nmismatched drafts return no definition. Native credential-header and\nsecret-default validation applies before disclosure. Machine callers can read\nonly their stable producer's imported flows. Human editors retain client\nownership. Source version, digest and reviewed references are immutable\neven after editable metadata or retry history changes. Draft comparison\nreflects actual authoring content, not caller-supplied fingerprints.\nThis read does not validate, merge, publish or execute an update.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"view","in":"query","required":true,"schema":{"type":"string","enum":["deployment","draft"]}}],"responses":{"200":{"description":"Original import provenance and current draft comparison","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"anyOf":[{"$ref":"#/components/schemas/FlowTemplateDeployment"},{"$ref":"#/components/schemas/FlowDraftSnapshot"}]}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/dashboard/{businessId}/automation-runtime/catalog":{"get":{"operationId":"getFlowTemplateCatalog","tags":["Flows"],"summary":"Discover versioned templates, endpoint references or managed deployments","description":"Requires flows.deploy, independently of flows.read. Uses the existing flow\ncatalog owner with a declared view. The flow_deployments view lists current\nmanaged heads owned by this connection, excluding graph/configuration data.\nThe flow_templates view returns bounded template metadata and\neligible business-owned webhook references, without URLs or credentials.\nDependencies paginate by a signed cursor bound to current authority,\nbusiness and limit. Availability is current, not a snapshot export. An\nempty dependencies page can have hasMore=true; follow nextCursor.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"view","in":"query","required":true,"schema":{"type":"string","enum":["flow_templates","flow_deployments"]}},{"$ref":"#/components/parameters/Limit"},{"name":"cursor","in":"query","schema":{"type":"string","minLength":1,"maxLength":2048,"pattern":"^[A-Za-z0-9_.-]+$"}}],"responses":{"200":{"description":"Current template catalog and one page of eligible references","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"anyOf":[{"$ref":"#/components/schemas/FlowTemplateCatalog"},{"$ref":"#/components/schemas/FlowDeploymentCatalog"}]}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/dashboard/{businessId}/automation-runtime/template-packs/{packId}/import":{"post":{"operationId":"importFlowTemplate","tags":["Flows"],"summary":"Create a client-owned draft from an exact flow template version","description":"Requires flows.deploy. Uses the existing builder import owner. All declared\ndependency slots must bind current business-owned endpoint references and\nreviewed revisions. No arbitrary graph, URL, secret or actor is accepted.\nCreates a draft only; never publishes or executes a flow. Reuse the same\nIdempotency-Key and input to recover its original creation receipt, even\nafter draft customization. Changed intent conflicts. The draft receipt is\nhistorical and does not assert the flow's current publication state.\nA blueprint reference selects an immutable partner source instead of an\ninternal pack: packId then names the blueprint key, version names its\nversion, and its application/digest are explicit. A current client\ninstallation must approve flows.deploy. Delegated callers may deploy only\ntheir own application's sources. Overrides must be declared by that\nsource. The same owner validates client bindings and creates the draft.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"packId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/FlowTemplateIdentifier"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/FlowTemplateImportBody"}}}},"responses":{"201":{"description":"Historical draft creation receipt, including matching retries","content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/FlowTemplateImportReceipt"}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/dashboard/{businessId}/billing/v2":{"get":{"operationId":"getSoftwareUsage","tags":["Usage"],"summary":"Read business software usage or current native plan limits","description":"Scope usage.read, separately approved from platform.usage.read request telemetry.\nThe existing billing owner serves fixed software_usage and software_limits\nviews to human billing viewers and business integrations. The full billing projection is\nunavailable to machine callers. Includes all execution origins in this business.\nSupply explicit UTC instants (seconds or milliseconds), [from,to), at most\n31 days within the last 365 days; future or unsupported windows are refused.\nCalls count retained matched dispatch/usage observations; tokens are whole\ntokens. Dispatch admission time selects the period. Missing observations\nare absent, and late observations can revise past totals. asOf is the read\ntime, not a completeness watermark. Zero means no observed retained usage,\nnot proof of no consumption. This meter has no retroactive coverage promise.\nThe usage view contains no monetary amounts. The software_limits view\ntakes no from/to and returns the native current plan's quantitative limits:\nagent places (all means unlimited), seats, soft monthly conversation\nallowance and exact monthly included AI allowance in INR paise. It uses\nthe same current-plan resolver as admission, including expired-grace fallback.\nIts version identifies the catalogue resolved by current gates, not the\nsubscription's sold version or historical entitlements. No remaining quota,\nenabled features, action eligibility, prices, invoices, wallets or Meta charges.\n","parameters":[{"$ref":"#/components/parameters/BusinessId"},{"name":"view","in":"query","required":true,"schema":{"type":"string","enum":["software_usage","software_limits"]}},{"name":"from","in":"query","required":false,"description":"Required only for software_usage; forbidden for software_limits.","schema":{"type":"string","format":"date-time","minLength":20,"maxLength":24}},{"name":"to","in":"query","required":false,"description":"Required only for software_usage; forbidden for software_limits.","schema":{"type":"string","format":"date-time","minLength":20,"maxLength":24}}],"responses":{"200":{"description":"Provisional observed usage or current native plan limits, according to view. No-store.","headers":{"X-Request-Id":{"$ref":"#/components/headers/X-Request-Id"}},"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"oneOf":[{"$ref":"#/components/schemas/SoftwareUsageSummary"},{"$ref":"#/components/schemas/SoftwareLimits"}]}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/platform/subscriptions":{"post":{"operationId":"createPlatformSubscription","tags":["Platform"],"summary":"Create an application-owned webhook receiver","description":"Requires platform.subscriptions.manage. Configures one receiver for the application; does not create merchant endpoints or grant resource access. Keep its signingSecret private. Reuse the exact input and key to recover a lost creation answer.","security":[{"applicationKey":[]}],"parameters":[{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePartnerSubscription"}}}},"responses":{"201":{"description":"Current application-owned receiver result. No-store.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PartnerSubscriptionSecretResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}}},"get":{"operationId":"listPlatformSubscriptions","tags":["Platform"],"summary":"List current application-owned webhook receivers","description":"Requires platform.subscriptions.manage. At most five non-disabled receivers. Disabled history stays addressable by receiver ID. Returns no signing secret.","security":[{"applicationKey":[]}],"responses":{"200":{"description":"Current application-owned receiver result. No-store.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PartnerSubscriptionListResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}}}},"/api/v1/platform/subscriptions/{subscriptionId}":{"get":{"operationId":"getPlatformSubscription","tags":["Platform"],"summary":"Read an application-owned webhook receiver","description":"Requires platform.subscriptions.manage. Returns current own-application configuration only, without signing secrets or business data.","security":[{"applicationKey":[]}],"parameters":[{"name":"subscriptionId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Current application-owned receiver result. No-store.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PartnerSubscriptionResponse"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}}},"patch":{"operationId":"updatePlatformSubscription","tags":["Platform"],"summary":"Update the reviewed receiver configuration","description":"Requires platform.subscriptions.manage. Requires the current revision. A URL change invalidates receiver proof. This mutation is not automatically retried; read current state after an uncertain answer.","security":[{"applicationKey":[]}],"parameters":[{"name":"subscriptionId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UpdatePartnerSubscription"}}}}