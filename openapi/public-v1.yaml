    DeveloperEventType:
      type: string
      enum: [operation.changed, contact.changed, conversation.changed, message.created, message.delivery_changed, order.changed, shipment.changed, endpoint.test]
    DeveloperResourceRef:
      type: object
      required: [type, id, revision, deleted, parent, href]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [contact, conversation, message, order, shipment]
        id:
          type: string
          format: uuid
        revision:
          type: string
        deleted:
          type: boolean
        parent:
          oneOf:
            - type: "null"
            - type: object
              required: [type, id]
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum: [conversation, order]
                id:
                  type: string
                  format: uuid
        href:
          type: string
          description: The `/v1` path to read the resource at.
    DeveloperChangedEventEnvelope:
      type: object
      description: Identifiers only. Never message text, names, phone numbers or amounts.
      required: [id, type, version, occurredAt, change, resource]
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          enum: [contact.changed, conversation.changed, message.created, order.changed, shipment.changed]
        version:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        change:
          type: string
          enum: [created, updated, deleted]
        resource:
          $ref: "#/components/schemas/DeveloperResourceRef"
    MessageDeliveryChangedEventEnvelope:
      type: object
      description: |
        Thin v1 observation of committed provider delivery facts, separate from
        operation progress. Read the current message using messages.read.
        Duplicate callbacks do not produce new events; recovery can coalesce
        several pending changes to their latest retained state.
      additionalProperties: false
      required: [id, type, version, occurredAt, change, resource]
      properties:
        id: { type: string }
        type: { type: string, const: message.delivery_changed }
        version: { type: integer, const: 1 }
        occurredAt: { type: string, format: date-time }
        change: { type: string, const: updated }
        resource:
          type: object
          additionalProperties: false
          required: [type, id, revision, deleted, parent, href]
          properties:
            type: { type: string, const: message }
            id: { type: string, format: uuid }
            revision: { type: string }
            deleted: { type: boolean, const: false }
            parent:
              type: object
              additionalProperties: false
              required: [type, id]
              properties:
                type: { type: string, const: conversation }
                id: { type: string, format: uuid }
            href: { type: string }
    OperationChangedEventEnvelope:
      type: object
      description: |
        Opt-in v2 observation of retained operation progress. Thin identifiers
        only, without message content or delivery claims. Existing resource
        events retain v1. Use your bound client's operations.get(resource.id);
        an event grants no read authority over another producer's operations.
      additionalProperties: false
      required: [id, type, version, occurredAt, change, businessId, producer, resource]
      properties:
        id: { type: string }
        type: { type: string, const: operation.changed }
        version: { type: integer, const: 2 }
        occurredAt: { type: string, format: date-time }
        change: { type: string, const: updated }
        businessId: { type: string, format: uuid }
        application:
          $ref: "#/components/schemas/ApplicationEventContext"
        producer:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, id]
              properties:
                kind: { type: string, enum: [business_key, human] }
                id: { type: string, format: uuid }
            - type: object
              additionalProperties: false
              required: [kind, id, authorityVersion]
              properties:
                kind: { type: string, const: installation }
                id: { type: string, format: uuid }
                authorityVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        resource:
          type: object
          additionalProperties: false
          required: [type, id, revision, deleted, parent, href]
          properties:
            type: { type: string, const: operation }
            id: { type: string, format: uuid }
            revision: { type: string, pattern: '^op1_[A-Za-z0-9_-]{43}$' }
            deleted: { type: boolean, const: false }
            parent: { type: "null" }
            href: { type: string }
    ApplicationEventContext:
      type: object
      additionalProperties: false
      required: [id, installationId, authorityVersion]
      properties:
        id: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        authorityVersion: { type: integer, minimum: 1, maximum: 2147483647 }
    ApplicationResourceEventEnvelope:
      type: object
      description: Thin v2 event for an application receiver, attributed to the original approved merchant installation.
      additionalProperties: false
      required: [id, type, version, occurredAt, change, businessId, application, resource]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [contact.changed, conversation.changed, message.created, message.delivery_changed, order.changed, shipment.changed]
        version: { type: integer, const: 2 }
        occurredAt: { type: string, format: date-time }
        change: { type: string, enum: [created, updated, deleted] }
        businessId: { type: string, format: uuid }
        application: { $ref: "#/components/schemas/ApplicationEventContext" }
        resource: { $ref: "#/components/schemas/DeveloperResourceRef" }
    EndpointTestEventEnvelope:
      type: object
      description: Sent only when you press Send test for one endpoint. Carries no workspace data.
      required: [id, type, version, occurredAt, change, test]
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          const: endpoint.test
        version:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        change:
          type: string
          const: test
        test:
          type: object
          required: [endpointId, challenge]
          additionalProperties: false
          properties:
            endpointId:
              type: string
              format: uuid
            challenge:
              type: string
    WebhookVerificationChallenge:
      type: object
      required: [type, version, verificationId, endpointId, targetGeneration, secretGeneration, challenge, expiresAt]
      additionalProperties: false
      properties:
        type:
          type: string
          const: endpoint.verify
        version:
          type: integer
          const: 1
        verificationId:
          type: string
        endpointId:
          type: string
          format: uuid
        targetGeneration:
          type: integer
        secretGeneration:
          type: integer
        challenge:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
        expiresAt:
          type: string
          format: date-time
    WebhookVerificationProof:
      type: object
      required: [challenge, proof]
      additionalProperties: false
      properties:
        challenge:
          type: string
        proof:
          type: string
          pattern: "^[0-9a-f]{64}$"
