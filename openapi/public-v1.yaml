openapi: 3.1.1
info:
  title: InsideDM Public API
  version: "1"
  summary: Read workspace data, send notifications and track operations with an API key.
  description: |
    Access to one InsideDM workspace, authenticated with an API key
    created in Settings › Developer. Contact custom fields, messaging and operation
    controls use their canonical shared owners. Recovery lookup uses a read-only
    POST to keep the original key outside URLs. Every response is
    JSON; every failure is `application/problem+json` with one of the fifteen
    codes in `ProblemCode`.

    Webhooks tell you that something changed (a thin event: identifiers only);
    you then read the change here, under your key's scopes.

    Guides: `docs/public-api/authentication.md`, `pagination.md`, `errors.md`,
    `webhooks.md`.

    Base URL: the API's hostname is shown in Settings › Developer. This
    document lists no `servers` until that hostname resolves publicly.

    This document is written by hand and checked against the routes the API
    actually serves (`apps/public-api/src/openapi.parity.test.ts`).
  license:
    name: Proprietary
    identifier: LicenseRef-InsideDM
security:
  - apiKey: []
tags:
  - name: Workspace
  - name: Contacts
  - name: Conversations
  - name: Messages
  - name: Orders
  - name: Shipments
  - name: Operations
  - name: Events
  - name: Platform
  - name: Usage
  - name: Flows
paths:
  /api/v1/automation-governance/{businessId}/recipes/{recipeId}/release-requests:
    post:
      operationId: requestFlowPublication
      tags: [Flows]
      summary: Submit this integration's unchanged managed draft for native human publication
      description: Requires flows.deploy. Uses the editor's compiler, simulation and release owner. Binds managed/draft/current-publication revisions. Creates a native release request, never publishes or approves as a human. Current governance and evidence rules apply. Matching retained intent recovers the same request's current status.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: recipeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPublicationInput' }
      responses:
        '201':
          description: Retained native release request, without publication authority
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ManagedPublicationRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/automation-governance/{businessId}/recipes/{recipeId}/release-requests/{releaseRequestId}:
    get:
      operationId: getFlowPublicationRequest
      tags: [Flows]
      summary: Observe this integration's managed publication request
      description: Requires flows.deploy and exactly view=managed. Returns status metadata, without graphs, evidence content or human identity. Current integration authority and managed-flow ownership remain required.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - { name: recipeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: releaseRequestId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: view, in: query, required: true, schema: { type: string, const: managed } }
      responses:
        '200':
          description: Current native release request status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ManagedPublicationRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/platform/blueprints/templates:
    get:
      operationId: listBlueprintTemplates
      tags: [Platform]
      summary: Discover portable template sources and typed customization parameters
      description: Requires platform.blueprints.manage. Global source metadata contains no client resources or credentials. Authoring does not grant merchant access or publish flows.
      responses:
        '200':
          description: Bounded supported source catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/PublicBlueprintTemplate' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/platform/blueprints/versions:
    post:
      operationId: createBlueprintVersion
      tags: [Platform]
      summary: Create an immutable application-owned portable blueprint version
      description: |
        Requires platform.blueprints.manage. Composes an exact reviewed template
        digest, typed parameters and explicit client override permissions. No
        arbitrary graph, client binding or publication flags are accepted. Repeat
        the original key/input to recover creation; changed intent conflicts.
        An existing version under a different key conflicts; read that version.
        Maximum fifty keys and one hundred versions per key/application. No
        merchant installation, client draft or runtime execution is created.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBlueprintVersionInput' }
      responses:
        '201':
          description: Immutable portable source and its digest
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicBlueprintVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/platform/blueprints/{blueprintKey}/versions:
    get:
      operationId: listBlueprintVersions
      tags: [Platform]
      summary: List this application's immutable versions for a blueprint key
      description: Requires platform.blueprints.manage. At most one hundred versions, in descending version order. Empty means no version under this application's key.
      parameters:
        - name: blueprintKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
      responses:
        '200':
          description: Bounded version history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PublicBlueprintVersion' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/platform/blueprints/{blueprintKey}/versions/{version}:
    get:
      operationId: getBlueprintVersion
      tags: [Platform]
      summary: Read one exact application-owned portable version
      description: Requires platform.blueprints.manage. A version is immutable; retrieving it does not grant authority to deploy into a client business.
      parameters:
        - name: blueprintKey
          in: path
          required: true
          schema: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9]\d{0,9}$' }
      responses:
        '200':
          description: Exact version and digest
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicBlueprintVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/flows/{businessId}/recipes/{recipeId}/graph/deployment-preview:
    post:
      operationId: previewBlueprintUpdate
      tags: [Flows]
      summary: Preview a managed blueprint update while preserving client overrides
      description: |
        Requires flows.deploy. Changes no authoring or publication state. Returns
        an explicit source/default/slot diff and optimistic managed/draft pins.
        Manual graph edits, unavailable sources, incompatible overrides and stale
        resource bindings require action. Layout is preserved. A preview is an
        observation, never execution authority or permission to skip fresh checks.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - name: recipeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewBlueprintUpdateInput' }
      responses:
        '200':
          description: Current update diff, preserved overrides and readiness
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlueprintUpdatePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/flows/{businessId}/recipes/{recipeId}/graph:
    put:
      operationId: applyBlueprintUpdate
      tags: [Flows]
      summary: Apply a reviewed blueprint update to its current client draft
      description: |
        Requires flows.deploy. Uses the existing editor graph PUT with a closed
        blueprint_update command; machine callers cannot supply a raw graph.
        Rechecks current source, bindings, original producer and both optimistic
        revisions. Preserves allowed client overrides and layout, blocks manual
        graph overwrite, and atomically appends immutable deployment history.
        Never publishes, changes an active publication or alters pinned runs.
        Matching retries return their original historical receipt after later
        edits; they do not reapply a graph. An earlier source can prepare a draft
        rollback, with normal human publication still required.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - name: recipeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyBlueprintUpdateInput' }
      responses:
        '200':
          description: Historical draft-update or unchanged receipt
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BlueprintUpdateReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: getFlowDeployment
      tags: [Flows]
      summary: Read immutable import origin and current draft drift
      description: |
        Requires flows.deploy. Uses the existing flow editor GET with a fixed
        metadata projection, without returning a graph. Machine callers can read
        only their stable producer's imported flows. Human editors retain client
        ownership. Source version, digest and reviewed references are immutable
        even after editable metadata or retry history changes. Draft comparison
        reflects actual authoring content, not caller-supplied fingerprints.
        This read does not validate, merge, publish or execute an update.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - name: recipeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: view
          in: query
          required: true
          schema: { type: string, const: deployment }
      responses:
        '200':
          description: Original import provenance and current draft comparison
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FlowTemplateDeployment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/automation-runtime/catalog:
    get:
      operationId: getFlowTemplateCatalog
      tags: [Flows]
      summary: Discover versioned flow templates and eligible client endpoint references
      description: |
        Requires flows.deploy, independently of flows.read. Uses the existing flow
        catalog owner with a fixed view. Returns bounded template metadata and
        eligible business-owned webhook references, without URLs or credentials.
        Dependencies paginate by a signed cursor bound to current authority,
        business and limit. Availability is current, not a snapshot export. An
        empty dependencies page can have hasMore=true; follow nextCursor.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - name: view
          in: query
          required: true
          schema: { type: string, const: flow_templates }
        - { $ref: '#/components/parameters/Limit' }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 2048, pattern: '^[A-Za-z0-9_.-]+$' }
      responses:
        '200':
          description: Current template catalog and one page of eligible references
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FlowTemplateCatalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/automation-runtime/template-packs/{packId}/import:
    post:
      operationId: importFlowTemplate
      tags: [Flows]
      summary: Create a client-owned draft from an exact flow template version
      description: |
        Requires flows.deploy. Uses the existing builder import owner. All declared
        dependency slots must bind current business-owned endpoint references and
        reviewed revisions. No arbitrary graph, URL, secret or actor is accepted.
        Creates a draft only; never publishes or executes a flow. Reuse the same
        Idempotency-Key and input to recover its original creation receipt, even
        after draft customization. Changed intent conflicts. The draft receipt is
        historical and does not assert the flow's current publication state.
        A blueprint reference selects an immutable partner source instead of an
        internal pack: packId then names the blueprint key, version names its
        version, and its application/digest are explicit. A current client
        installation must approve flows.deploy. Delegated callers may deploy only
        their own application's sources. Overrides must be declared by that
        source. The same owner validates client bindings and creates the draft.
      parameters:
        - { $ref: '#/components/parameters/BusinessId' }
        - name: packId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowTemplateImportBody' }
      responses:
        '201':
          description: Historical draft creation receipt, including matching retries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FlowTemplateImportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/billing/v2:
    get:
      operationId: getSoftwareUsage
      tags: [Usage]
      summary: Read business software usage or current native plan limits
      description: |
        Scope usage.read, separately approved from platform.usage.read request telemetry.
        The existing billing owner serves fixed software_usage and software_limits
        views to human billing viewers and business integrations. The full billing projection is
        unavailable to machine callers. Includes all execution origins in this business.
        Supply explicit UTC instants (seconds or milliseconds), [from,to), at most
        31 days within the last 365 days; future or unsupported windows are refused.
        Calls count retained matched dispatch/usage observations; tokens are whole
        tokens. Dispatch admission time selects the period. Missing observations
        are absent, and late observations can revise past totals. asOf is the read
        time, not a completeness watermark. Zero means no observed retained usage,
        not proof of no consumption. This meter has no retroactive coverage promise.
        The usage view contains no monetary amounts. The software_limits view
        takes no from/to and returns the native current plan's quantitative limits:
        agent places (all means unlimited), seats, soft monthly conversation
        allowance and exact monthly included AI allowance in INR paise. It uses
        the same current-plan resolver as admission, including expired-grace fallback.
        Its version identifies the catalogue resolved by current gates, not the
        subscription's sold version or historical entitlements. No remaining quota,
        enabled features, action eligibility, prices, invoices, wallets or Meta charges.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - { name: view, in: query, required: true, schema: { type: string, enum: [software_usage, software_limits] } }
        - { name: from, in: query, required: false, description: Required only for software_usage; forbidden for software_limits., schema: { type: string, format: date-time, minLength: 20, maxLength: 24 } }
        - { name: to, in: query, required: false, description: Required only for software_usage; forbidden for software_limits., schema: { type: string, format: date-time, minLength: 20, maxLength: 24 } }
      responses:
        '200':
          description: Provisional observed usage or current native plan limits, according to view. No-store.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/SoftwareUsageSummary' }
                      - { $ref: '#/components/schemas/SoftwareLimits' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  "/api/v1/platform/subscriptions":
    post:
      operationId: "createPlatformSubscription"
      tags: ["Platform"]
      summary: "Create an application-owned webhook receiver"
      description: "Requires platform.subscriptions.manage. Configures one receiver for the application; does not create merchant endpoints or grant resource access. Keep its signingSecret private. Reuse the exact input and key to recover a lost creation answer."
      security: [{"applicationKey":[]}]
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreatePartnerSubscription"
      responses:
        201:
          description: "Current application-owned receiver result. No-store."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PartnerSubscriptionSecretResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        429:
          $ref: "#/components/responses/RateLimited"
        500:
          $ref: "#/components/responses/InternalError"
        503:
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: "listPlatformSubscriptions"
      tags: ["Platform"]
      summary: "List current application-owned webhook receivers"
      description: "Requires platform.subscriptions.manage. At most five non-disabled receivers. Disabled history stays addressable by receiver ID. Returns no signing secret."
      security: [{"applicationKey":[]}]
      responses:
        200:
          description: "Current application-owned receiver result. No-store."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PartnerSubscriptionListResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        429:
          $ref: "#/components/responses/RateLimited"
        500:
          $ref: "#/components/responses/InternalError"
        503:
          $ref: "#/components/responses/Unavailable"
  "/api/v1/platform/subscriptions/{subscriptionId}":
    get:
      operationId: "getPlatformSubscription"
      tags: ["Platform"]
      summary: "Read an application-owned webhook receiver"
      description: "Requires platform.subscriptions.manage. Returns current own-application configuration only, without signing secrets or business data."
      security: [{"applicationKey":[]}]
      parameters: [{"name":"subscriptionId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      responses:
        200:
          description: "Current application-owned receiver result. No-store."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PartnerSubscriptionResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        429:
          $ref: "#/components/responses/RateLimited"
        500:
          $ref: "#/components/responses/InternalError"
        503:
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: "updatePlatformSubscription"
      tags: ["Platform"]
      summary: "Update the reviewed receiver configuration"
      description: "Requires platform.subscriptions.manage. Requires the current revision. A URL change invalidates receiver proof. This mutation is not automatically retried; read current state after an uncertain answer."
      security: [{"applicationKey":[]}]
      parameters: [{"name":"subscriptionId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdatePartnerSubscription"
      responses:
        200:
          description: "Current application-owned receiver result. No-store."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PartnerSubscriptionResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        429:
          $ref: "#/components/responses/RateLimited"
        500:
          $ref: "#/components/responses/InternalError"
        503:
          $ref: "#/components/responses/Unavailable"
  "/api/v1/platform/subscriptions/{subscriptionId}/verify":
    post:
      operationId: "verifyPlatformSubscription"
      tags: ["Platform"]
      summary: "Verify an application-owned receiver"
      description: "Requires platform.subscriptions.manage. Sends the existing signed endpoint.verify challenge. A valid proof establishes readiness, not activation. Five attempts per receiver per 15 minutes and twenty per application per hour. Verification throttles use partner-webhook-verification and Retry-After. This action is not automatically retried."
      security: [{"applicationKey":[]}]
      parameters: [{"name":"subscriptionId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
