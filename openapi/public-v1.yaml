  /api/v1/platform/businesses/{businessId}/usage:
    get:
      operationId: getPartnerApiUsage
      tags: [Platform]
      summary: Read this application's own client API telemetry
      description: |
        Requires platform.usage.read. The owner resolves this app's installation
        and filters its real producer before aggregation; no other apps or key
        lineages are included. Own historical telemetry remains readable after
        installation revocation, without restoring business data access.
        Defaults to seven complete UTC days. Day windows are at most 31 days;
        minute windows at most 24 hours. Date and RFC 3339 inputs normalize to UTC.
        Only complete retained buckets are supported; unavailable retention or
        unfinished windows fail rather than returning false zeros.
        Counters are batched telemetry and may lag. They are not billing, provider
        cost, authoritative software consumption or a hard quota.
      security:
        - applicationKey: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: granularity
          in: query
          required: false
          schema: { enum: [day, minute] }
        - name: from
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
        - name: to
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Recorded own-producer counts with explicit UTC/source/retention/freshness.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicPartnerApiUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/platform/businesses:
    post:
      operationId: createPlatformBusiness
      tags: [Platform]
      summary: Provision a separate merchant workspace and its ownership claim
      description: |
        Requires platform.businesses.create and an operator-approved creation allowance.
        Defaults to no allowance. Unclaimed tenants count toward it. A stable key
        recovers the same receipt; changed intent or a reused external reference conflicts.
        No person, installation, channel connection, billing agreement or business-data
        grant is fabricated. The merchant explicitly claims the empty tenant through
        the ten-minute private link, then separately approves application access.
        Credential rotation preserves the original lineage; a new lineage cannot
        revive a revoked pending claim. A claim callback is navigation, never authority.
      security:
        - applicationKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlatformBusinessInput' }
      responses:
        '201':
          description: Creation receipt, with a private pending ownership link. No-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessCreationLinkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: listPlatformBusinesses
      tags: [Platform]
      summary: Discover businesses with a current installation of this application
      description: |
        Requires platform.businesses.read. Candidate IDs come from this app's
        approved requests; each profile requires a current active own installation
        under the actual tenant's policy. No relationship, readiness, transcript,
        merchant identity or business data grant is inferred.
        Keyset pages have a fixed approval cutoff and a signed fifteen-minute
        cursor bound to application, effective scopes and limit. A page can be
        empty with nextCursor when a candidate grant was revoked. Continue by
        cursor; never restart silently on invalid_cursor or expiry.
      security:
        - applicationKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 2048, pattern: '^[!-~]+$' }
      responses:
        '200':
          description: Own currently installed businesses. No-store; cursors are not grants.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerBusinessPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
