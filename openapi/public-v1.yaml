      type: object
      maxProperties: 20
      propertyNames: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
      additionalProperties:
        oneOf:
          - { type: string, minLength: 1, maxLength: 1000 }
          - { type: integer, minimum: 0, maximum: 2147483647 }
    BlueprintOverrideKeys:
      type: array
      maxItems: 20
      items: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
    CreateBlueprintVersionInput:
      type: object
      additionalProperties: false
      required: [key, version, name, description, template]
      properties:
        key: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
        version: { type: integer, minimum: 1, maximum: 2147483647 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        template: { $ref: '#/components/schemas/BlueprintTemplateReference' }
        parameters: { $ref: '#/components/schemas/BlueprintParameters' }
        clientOverrides: { $ref: '#/components/schemas/BlueprintOverrideKeys' }
    BlueprintDependencies:
      type: array
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        required: [id, kind, method]
        properties:
          id: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          kind: { type: string, const: webhook_endpoint }
          method: { type: string, const: POST }
    BlueprintVariables:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [id, key, type, scope, required, mutable]
        properties:
          id: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          key: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          type: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          scope: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          required: { type: boolean }
          mutable: { type: boolean }
    BlueprintCapabilities:
      type: object
      additionalProperties: false
      required: [channels, actions]
      properties:
        channels: { type: array, maxItems: 3, items: { type: string, enum: [instagram, whatsapp, unified] } }
        actions: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/FlowTemplateIdentifier' } }
    BlueprintDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, key, version, name, description, template, parameters, clientOverrides, dependencies, variables, capabilities]
      properties:
        schemaVersion: { type: string, const: inside-flow-blueprint/v1 }
        key: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
        version: { type: integer, minimum: 1, maximum: 2147483647 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        template: { $ref: '#/components/schemas/BlueprintTemplateReference' }
        parameters: { $ref: '#/components/schemas/BlueprintParameters' }
        clientOverrides: { $ref: '#/components/schemas/BlueprintOverrideKeys' }
        dependencies: { $ref: '#/components/schemas/BlueprintDependencies' }
        variables: { $ref: '#/components/schemas/BlueprintVariables' }
        capabilities: { $ref: '#/components/schemas/BlueprintCapabilities' }
    PublicBlueprintVersion:
      type: object
      additionalProperties: false
      required: [applicationId, definition, digest, createdAt]
      properties:
        applicationId: { type: string, format: uuid }
        definition: { $ref: '#/components/schemas/BlueprintDefinition' }
        digest: { $ref: '#/components/schemas/FlowTemplateDigest' }
        createdAt: { type: string, format: date-time }
    BlueprintParameterDefinition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, type, defaultValue, maxLength]
          properties:
            id: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
            type: { type: string, const: string }
            defaultValue: { type: string, minLength: 1, maxLength: 1000 }
            maxLength: { type: integer, minimum: 1, maximum: 1000 }
        - type: object
          additionalProperties: false
          required: [id, type, defaultValue, minimum, maximum]
          properties:
            id: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
            type: { type: string, const: integer }
            defaultValue: { type: integer, minimum: 1, maximum: 2147483647 }
            minimum: { type: integer, minimum: 1, maximum: 2147483647 }
            maximum: { type: integer, minimum: 1, maximum: 2147483647 }
    PublicBlueprintTemplate:
      type: object
      additionalProperties: false
      required: [template, name, description, parameterDefinitions, dependencies, variables, capabilities]
      properties:
        template: { $ref: '#/components/schemas/BlueprintTemplateReference' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 500 }
        parameterDefinitions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/BlueprintParameterDefinition' } }
        dependencies: { $ref: '#/components/schemas/BlueprintDependencies' }
        variables: { $ref: '#/components/schemas/BlueprintVariables' }
        capabilities: { $ref: '#/components/schemas/BlueprintCapabilities' }
    ManagedPublicationInput:
      type: object
      additionalProperties: false
      required: [kind, expectedDeploymentRevision, expectedDraftRevision, expectedPublishedVersionId]
      properties:
        kind: { type: string, const: managed_deployment }
        expectedDeploymentRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        expectedDraftRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        expectedPublishedVersionId: { type: [string, 'null'], format: uuid }
        note: { type: string, maxLength: 500, pattern: '^[^\x00-\x1f\x7f]*$' }
    ManagedPublicationRequest:
      type: object
      additionalProperties: false
      required: [businessId, recipeId, id, deploymentRevision, draftRevision, status, requestedAt, publishedVersionId]
      properties:
        businessId: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        id: { type: string, format: uuid }
        deploymentRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        draftRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { type: string, enum: [pending, pending_evidence, approved, rejected, published, superseded, dismissed] }
        requestedAt: { type: string, format: date-time }
        publishedVersionId: { type: [string, 'null'], format: uuid }
    FlowTemplateDeployment:
      type: object
      additionalProperties: false
      required: [businessId, recipeId, revision, flowStatus, publication, source, bindings, overrides, createdAt, draft]
      properties:
        businessId: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        source:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, packId, version, digest]
              properties:
                kind: { type: string, const: internal_template }
                packId: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
                version: { $ref: '#/components/schemas/FlowTemplateVersion' }
                digest: { $ref: '#/components/schemas/FlowTemplateDigest' }
            - type: object
              additionalProperties: false
              required: [kind, applicationId, key, version, digest, template]
              properties:
                kind: { type: string, const: partner_blueprint }
                applicationId: { type: string, format: uuid }
                key: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
                version: { $ref: '#/components/schemas/FlowTemplateVersion' }
                digest: { $ref: '#/components/schemas/FlowTemplateDigest' }
                template:
                  type: object
                  additionalProperties: false
                  required: [packId, version, digest]
                  properties:
                    packId: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
                    version: { $ref: '#/components/schemas/FlowTemplateVersion' }
                    digest: { $ref: '#/components/schemas/FlowTemplateDigest' }
        revision: { type: integer, minimum: 1, maximum: 2147483647 }
        flowStatus: { type: string, enum: [draft, shadow, active, paused, retired] }
        publication:
          type: object
          additionalProperties: false
          required: [versionId, state]
          properties:
            versionId: { type: [string, 'null'], format: uuid }
            state: { type: string, enum: [not_published, matches_managed_source, different, unavailable] }
        bindings:
          type: object
          maxProperties: 20
          propertyNames: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          additionalProperties: { $ref: '#/components/schemas/FlowTemplateBinding' }
        overrides: { $ref: '#/components/schemas/BlueprintParameters' }
        createdAt: { type: string, format: date-time }
        draft:
          type: object
          additionalProperties: false
          required: [state, revision]
          properties:
            state: { type: string, enum: [unchanged, modified, missing, unavailable] }
            revision: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
    FlowTemplateVersion:
      type: string
      pattern: '^[1-9]\d{0,9}$'
      description: Positive decimal version, at most 2147483647.
    FlowTemplateDigest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    FlowTemplateBinding:
      type: object
      additionalProperties: false
      required: [endpointId, expectedRevision]
      properties:
        endpointId: { type: string, format: uuid }
        expectedRevision: { type: integer, minimum: 0, maximum: 2147483647 }
    FlowTemplateImportBody:
      oneOf:
        - { $ref: '#/components/schemas/InternalTemplateImportBody' }
        - { $ref: '#/components/schemas/BlueprintImportBody' }
    InternalTemplateImportBody:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/FlowTemplateVersion' }
        bindings:
          type: object
          maxProperties: 20
          propertyNames: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          additionalProperties: { $ref: '#/components/schemas/FlowTemplateBinding' }
    BlueprintImportBody:
      type: object
      additionalProperties: false
      required: [version, blueprint]
      properties:
        version: { $ref: '#/components/schemas/FlowTemplateVersion' }
        blueprint:
          type: object
          additionalProperties: false
          required: [applicationId, digest]
          properties:
            applicationId: { type: string, format: uuid }
            digest: { $ref: '#/components/schemas/FlowTemplateDigest' }
        bindings:
          type: object
          maxProperties: 20
          propertyNames: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
          additionalProperties: { $ref: '#/components/schemas/FlowTemplateBinding' }
        overrides: { $ref: '#/components/schemas/BlueprintParameters' }
    FlowTemplateImportReceipt:
      type: object
      additionalProperties: false
      required: [businessId, recipeId, packId, version, digest, status]
      properties:
        businessId: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        packId: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
        version: { $ref: '#/components/schemas/FlowTemplateVersion' }
        digest: { $ref: '#/components/schemas/FlowTemplateDigest' }
        status: { type: string, const: draft }
    FlowTemplateSummary:
      type: object
      additionalProperties: false
      required: [id, version, digest, name, description, channel, dependencySlots]
      properties:
        id: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
        version: { $ref: '#/components/schemas/FlowTemplateVersion' }
        digest: { $ref: '#/components/schemas/FlowTemplateDigest' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 500 }
        channel: { type: string, enum: [instagram, whatsapp, unified] }
        dependencySlots:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, kind, method, required]
            properties:
              id: { $ref: '#/components/schemas/FlowTemplateIdentifier' }
              kind: { type: string, const: webhook_endpoint }
              method: { type: string, const: POST }
              required: { type: boolean, const: true }
    FlowTemplateCatalog:
      type: object
      additionalProperties: false
      required: [businessId, templates, dependencies, page]
      properties:
        businessId: { type: string, format: uuid }
        templates:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FlowTemplateSummary' }
        dependencies:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, kind, name, revision]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, const: webhook_endpoint }
              name: { type: string, minLength: 1, maxLength: 120 }
              revision: { type: integer, minimum: 0, maximum: 2147483647 }
        page:
          type: object
          additionalProperties: false
          required: [hasMore, nextCursor]
          properties:
            hasMore: { type: boolean }
            nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048, pattern: '^[A-Za-z0-9_.-]+$' }
    PublicFlowRun:
      type: object
      additionalProperties: false
      required: [id, flowId, status, startedAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        flowId: { type: string, format: uuid }
        status:
          type: string
          enum: [running, waiting, completed, failed, cancelled]
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    PublicOperationFields:
      type: object
      required: [id, kind, state, revision, resource, phase, effects, reasonCode, createdAt, updatedAt, completedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [messages.send, events.publish]
        state:
          type: string
          enum: [accepted, queued, running, waiting, succeeded, failed, cancelled, expired, requires_reconciliation, unknown]
        revision:
          type: string
          pattern: '^op1_[A-Za-z0-9_-]{43}$'
        resource:
          type: [object, 'null']
          required: [type, id]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [message, flow_run]
            id:
              type: string
              format: uuid
        phase:
          type: [string, 'null']
        effects:
          type: string
          enum: [none, partial, submitted, unknown]
        reasonCode:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    ProblemCode:
      type: string
      description: |
        The closed set. `method_not_allowed` (405, with `Allow`) answers a
        known path with the wrong method. Shared writes return intent/state
        conflicts according to their owner. `verification_failed` (422) also
        identifies retained customer evidence that cannot establish an opt-in.
      enum:
        - invalid_request
        - invalid_cursor
        - invalid_token
        - insufficient_scope
        - feature_not_enabled
        - resource_not_found
        - method_not_allowed
        - response_too_large
        - rate_limited
        - internal_error
        - dependency_unavailable
        - idempotency_conflict
        - revision_conflict
        - invalid_state
        - verification_failed
    Problem:
      type: object
      description: RFC 9457 problem details. `policyId` and `errors` are always present, `null` outside their one case.
      required: [type, title, status, detail, instance, code, requestId, retryable, policyId, errors]
      additionalProperties: false
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: "#/components/schemas/ProblemCode"
        requestId:
          type: string
        retryable:
          type: boolean
        policyId:
          type: [string, "null"]
          enum: [public-read-v1-standard, partner-webhook-verification, null]
        errors:
          type: [array, "null"]
          maxItems: 8
          items:
            type: object
            required: [field, reason]
            additionalProperties: false
            properties:
              field:
                type: string
              reason:
                type: string
    PageInfo:
      type: object
      required: [nextCursor]
      additionalProperties: false
      properties:
        nextCursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; `null` on the last page.
    PublicScope:
      type: string
      enum: [contacts.read, contacts.write, conversations.read, messages.read, messages.send, operations.read, events.write, flows.read, flows.deploy, templates.read, messaging.read, messaging.configuration.read, consents.write, consents.read, usage.read, orders.read, shipments.read]
    PublishEventInput:
      type: object
      additionalProperties: false
      required: [id, binding, subject]
      properties:
        id: { type: string, pattern: '^[!-~]{1,128}$' }
        binding: { type: string, format: uuid }
        type: { type: string, const: flow.triggered }
        occurredAt: { type: string, format: date-time, minLength: 24, maxLength: 24 }
        subject:
          type: object
          additionalProperties: false
          required: [contactId]
          properties:
            contactId: { type: string, format: uuid }
        properties:
          type: object
          maxProperties: 100
          additionalProperties: true
    CreateContactRequest:
      type: object
      additionalProperties: false
      required: [channel, name, phone]
      properties:
        channel: { type: string, const: whatsapp }
        name: { type: string, minLength: 1, maxLength: 256 }
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
    ContactReference:
      type: object
      additionalProperties: false
      required: [contactId, revision]
      properties:
        contactId: { type: string, format: uuid }
        revision: { type: string, pattern: '^\d+$' }
    UpdateContactInput:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: [string, "null"], minLength: 1, maxLength: 256 }
    UpdatedContact:
      type: object
      additionalProperties: false
      required: [contactId, displayName, revision]
      properties:
        contactId: { type: string, format: uuid }
        displayName: { type: [string, "null"], minLength: 1, maxLength: 256 }
        revision: { type: string, pattern: '^\d+$' }
    ReplaceContactTagsInput:
      type: object
      additionalProperties: false
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 256 }
    ReplacedContactTags:
      type: object
      additionalProperties: false
      required: [contactId, tags, revision]
      properties:
        contactId: { type: string, format: uuid }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: string, pattern: '^\d+$' }
    ContactConsentState:
      type: object
      additionalProperties: false
      required: [contactId, identities]
      properties:
        contactId: { type: string, format: uuid }
        identities:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [identityId, channel, handle, purposes]
            properties:
              identityId: { type: string, format: uuid }
              channel: { type: string, enum: [whatsapp, instagram] }
              handle: { type: string, minLength: 1, maxLength: 256 }
              purposes:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  type: object
                  additionalProperties: false
                  required: [purpose, status, changedAt]
                  properties:
                    purpose: { type: string, enum: [marketing, utility, service, loyalty, ad_measurement] }
                    status: { type: string, enum: [granted, withdrawn, unknown] }
                    changedAt: { type: [string, 'null'], format: date-time }
    RecordMarketingOptInInput:
      type: object
      additionalProperties: false
      required: [messageId]
      properties:
        messageId: { type: string, format: uuid }
    MarketingOptInRegistration:
      type: object
      additionalProperties: false
      required: [contactId, identityId, channel, purpose, status, changedAt]
      properties:
        contactId: { type: string, format: uuid }
        identityId: { type: string, format: uuid }
        channel: { type: string, enum: [whatsapp, instagram] }
        purpose: { type: string, const: marketing }
        status: { type: string, enum: [granted, withdrawn, unknown] }
        changedAt: { type: string, format: date-time }
    WithdrawConsentInput:
      type: object
      additionalProperties: false
      required: [to, purpose]
      properties:
        to:
          type: object
          additionalProperties: false
          required: [phone]
          properties:
            phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        purpose: { type: string, enum: [marketing, utility, service, loyalty, ad_measurement] }
    ConsentWithdrawal:
      type: object
      additionalProperties: false
      required: [channel, purpose, status, changedAt]
      properties:
        channel: { type: string, const: whatsapp }
        purpose: { type: string, enum: [marketing, utility, service, loyalty, ad_measurement] }
        status: { type: string, enum: [granted, withdrawn, unknown] }
        changedAt: { type: string, format: date-time }
    PublicMessagingConfiguration:
      type: object
      additionalProperties: false
      required: [value, version]
      properties:
        version: { type: [integer, 'null'], minimum: 1 }
        value:
          type: object
          additionalProperties: false
          required: [defaultTextPurposeBinding, templateAliases, textPurposeBindings]
          properties:
            defaultTextPurposeBinding: { type: [string, 'null'], maxLength: 80 }
            templateAliases:
              type: object
              maxProperties: 100
              propertyNames: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
              additionalProperties: { type: string, format: uuid }
            textPurposeBindings:
              type: object
              maxProperties: 50
              propertyNames: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,79}$' }
              additionalProperties:
                type: object
                additionalProperties: false
                required: [purpose]
                properties:
                  purpose: { type: string, enum: [service, marketing] }
    PublicTemplate:
      type: object
      additionalProperties: false
      required: [id, name, language, category, body, buttons, parameterFormat, variables, supported, unavailableReason, notificationSupported]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 512 }
        language: { type: string, maxLength: 64 }
        category: { type: string, maxLength: 64 }
        body: { type: string, maxLength: 16384 }
        buttons:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 1024 }
        parameterFormat: { type: string, enum: [named, positional] }
        variables:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [key, label]
            properties:
              key: { type: string, maxLength: 64 }
              label: { type: string, maxLength: 256 }
        supported: { type: boolean }
        notificationSupported: { type: boolean }
        unavailableReason: { type: [string, 'null'], maxLength: 512 }
    TemplatePage:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PublicTemplate' }
        page: { $ref: '#/components/schemas/PageInfo' }
    MessagingReadiness:
      type: object
      additionalProperties: false
      required: [channel, accountReady, reasonCode, textPurposeConfigured]
      properties:
        channel: { type: string, const: whatsapp }
        accountReady: { type: boolean }
        reasonCode:
          type: [string, 'null']
          enum: [null, account_not_connected, account_paused, credentials_unavailable, credentials_expired, account_ambiguous, account_unavailable]
        textPurposeConfigured: { type: boolean }
    ContactAttributeValues:
      type: object
      maxProperties: 500
      propertyNames:
        pattern: '^[a-z][a-z0-9_]{0,63}$'
      additionalProperties:
        type: [string, number, boolean, "null"]
    UpdateContactAttributesInput:
      type: object
      required: [attributes]
      additionalProperties: false
      properties:
        attributes:
          allOf:
            - $ref: "#/components/schemas/ContactAttributeValues"
          minProperties: 1
    UpdatedContactAttributes:
      type: object
      required: [contactId, attributes, revision]
      additionalProperties: false
      properties:
        contactId:
          type: string
          format: uuid
        attributes:
          $ref: "#/components/schemas/ContactAttributeValues"
        revision:
          type: string
          pattern: '^\d+$'
    PublicChannel:
      type: string
      enum: [instagram, whatsapp, unknown]
    PublicWorkspace:
      type: object
      required: [id, name, timeZone, key]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
          description: IANA time zone, e.g. Asia/Kolkata.
        key:
          type: [object, 'null']
          description: Direct API-key metadata; null for an approved installation delegation.
          required: [id, label, scopes, state, createdAt, expiresAt]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            label:
              type: string
            scopes:
              type: array
              items:
                $ref: "#/components/schemas/PublicScope"
            state:
              type: string
              enum: [active, rotating]
            createdAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
              description: When this key stops working (earlier than its lifetime once it has been rotated).
    PublicContactSummary:
      type: object
      required: [id, displayName, email, phone, channels, revision, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: [string, "null"]
