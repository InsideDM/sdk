  "/api/v1/platform/subscriptions/{subscriptionId}/businesses/{businessId}/deliveries":
    get:
      "operationId": "listPlatformSubscriptionDeliveries"
      "tags": ["Platform"]
      "summary": "Read bounded thin delivery history"
      "description": "Requires platform.subscriptions.manage and the exact current merchant installation with the event's read scope. Defaults to the last day; at most thirty days and one hundred records. Signed fifteen-minute cursors bind tenant, grant epoch, configuration and filters. Expired or mismatched cursors return invalid_cursor. Older receiver generations can be read under the same grant but cannot be replayed."
      "security": [{"applicationKey":[]}]
      "parameters": [{"name":"subscriptionId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"$ref":"#/components/parameters/BusinessId"},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100}},{"name":"cursor","in":"query","required":false,"schema":{"type":"string","maxLength":2048,"pattern":"^[-A-Za-z0-9_]+\\.[-A-Za-z0-9_]{43}$"}},{"name":"from","in":"query","required":false,"schema":{"type":"string","format":"date-time","pattern":"^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{3}Z$"}},{"name":"to","in":"query","required":false,"schema":{"type":"string","format":"date-time","pattern":"^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{3}Z$"}},{"name":"status","in":"query","required":false,"schema":{"type":"string","enum":["pending","processing","retrying","delivered","failed","cancelled"]}},{"name":"eventType","in":"query","required":false,"schema":{"type":"string","enum":["contact.changed","conversation.changed","message.created","message.delivery_changed","order.changed","shipment.changed","operation.changed"]}}]
