        observe the outcome. The callback's insidedm_request is only a reference;
        the partner backend must read this authenticated result and match it to
        the request it created. A historical approved result is not current data
        authority. This read never returns the approval capability or human identity.
      security:
        - applicationKey: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The current request outcome, with no approval link.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicInstallationRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/platform/delegations:
    post:
      operationId: createBusinessDelegation
      tags: [Platform]
      summary: Acquire a short-lived token for an approved business installation
      description: |
        Requires a server application credential with platform.delegations.create.
        Merchant approval and current scope ceilings are mandatory. Supplying a
        business ID does not grant access. The lifetime is at most fifteen minutes
        and is bounded by the application's root credential. Refresh preserves
        installation identity. No Idempotency-Key, cookie, query or user assertion.
        Application credentials are never accepted by business resource routes.
      security:
        - applicationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationExchangeInput' }
      responses:
        '200':
          description: A business-bound server credential. Never cache or log this response.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BusinessDelegation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/agent-runs/{runId}:
    get:
      operationId: getFlowRun
      tags: [Events]
      summary: Read the current status of an SDK-started flow
      description: |
        Scope flows.read. Uses the existing dashboard run endpoint with its
        minimal progress view. Business keys can read only their own producer's
        retained event-started runs. No trace, inputs or failure text is exposed.
        Completed publication and completed flow execution are separate facts.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid, pattern: '^[0-9a-f-]{36}$' }
        - name: view
          in: query
          required: true
          schema: { type: string, const: progress }
      responses:
        '200':
          description: Current retained run status.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: '#/components/schemas/PublicFlowRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/flows/{businessId}/events:
    post:
      operationId: publishEvent
      tags: [Events]
      summary: Start a published from-system flow for a known contact
      description: |
        Scope events.write. The pilot binding is the existing published flow ID;
        no second SDK configuration screen or account choice is required.
        Its published mappings read properties, while subject.contactId binds an
        existing owned contact without minting or relinking an identity.
        The stable event id must equal Idempotency-Key. Reuse that id and body
        after a lost response; different input conflicts. Optional type defaults
        to flow.triggered and optional occurredAt uses the original receipt time.
        Explicit occurrence times must be within 24 hours and five minutes of
        future skew. Replays do not refresh that clock or select a new version.
        HTTP 202 means the original start is retained. Operation success means
        a flow was admitted, separately from later effects or message delivery.
        The originating grant is rechecked across waits and before later effects.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishEventInput' }
      responses:
        '202':
          description: Durable progress of the accepted event publication.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicOperation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/inbox/{businessId}/messages:
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Submit one notification using the shared message owner
      description: |
        Scope messages.send. Uses the same endpoint as UI replies; business keys
        submit notification intent only. WhatsApp resolves automatically for the
        organization. An explicit approved template ID needs no messaging setup.
        Acceptance queues work; it does not mean provider delivery. Consent,
        account readiness and content are checked again before sending. Keep the
        original Idempotency-Key and input across retries, including timeouts.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationInput'
      responses: &MessageOperationResponses
        '200':
          description: Content-free progress of the accepted operation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/PublicOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency conflict, changed revision or cancellation too late.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/inbox/{businessId}/messages/preview:
    post:
      operationId: previewMessage
      tags: [Messages]
      summary: Observe notification eligibility without creating or reserving anything
      description: Scope messages.send. Eligibility can change before dispatch. No Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationInput'
      responses:
        '200':
          description: Current eligibility, with no delivery guarantee.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/MessagePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/inbox/{businessId}/operations/{operationId}:
    get:
      operationId: getOperation
      tags: [Operations]
      summary: Read progress of an operation owned by this integration
      description: Scope operations.read. An unrelated key cannot read another integration's operation.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/OperationId'
      responses: *MessageOperationResponses
  /api/v1/inbox/{businessId}/operations/by-idempotency-key:
    post:
      operationId: lookupOperation
      tags: [Operations]
      summary: Recover an operation after a lost submission response
      description: |
        Scope operations.read. This is a read using POST so the original key
        remains in the signed body, outside URLs and access logs. It performs
        no new send. Do not supply an Idempotency-Key header on this read.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationLookupInput'
      responses: *MessageOperationResponses
  /api/v1/inbox/{businessId}/operations/{operationId}/cancel:
    post:
      operationId: cancelOperation
      tags: [Operations]
      summary: Cancel before provider sending begins, using the observed revision
      description: |
        Scope operations.read and the original domain's current write scope
        (messages.send or events.write). Requires a fresh cancellation
        Idempotency-Key and the observed operation revision. Already admitted or
        uncertain provider attempts cannot be cancelled or automatically replaced.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationCancelInput'
      responses: *MessageOperationResponses
  /api/v1/dashboard/{businessId}/contacts:
    post:
      operationId: createContact
      tags: [Contacts]
      summary: Create or resolve one phone contact
      description: |
        Scope contacts.write. Uses the existing manual-contact owner with the
        fixed reference view, available to verified humans and integrations.
        The phone is E.164 and needs no WhatsApp account connection. Existing
        contacts for that phone are reused; only a missing name is filled.
        No consent, provider conversation or send is created. The minimal result
        contains the contact ID and current revision. Replays retain the original
        contact and do not reapply old profile data. An erased, erasure-pending or
        merged original contact is not found on replay. Receipts last 30 days.
        This view supports phone contacts only; use the existing tag/custom-field
        operations separately. Caller-declared consent and identity reassignment
        are not accepted.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: view
          in: query
          required: true
          schema: { type: string, const: reference }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '200':
          description: Created or existing contact reference, without a private dashboard projection.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContactReference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/contacts/{contactId}:
    patch:
      operationId: updateContact
      tags: [Contacts]
      summary: Change a contact's display name
      description: |
        Scope contacts.write, or contacts.edit for a verified human. Set a name
        containing 1–256 characters, or null to clear it. This canonical contact
        owner does not reassign identities or grant consent. Reuse the same key
        with the same intent for 30-day retry recovery. Replay reads the current
        profile without overwriting later edits. Revision is observational;
        this operation does not offer compare-and-set semantics.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactInput' }
      responses:
        '200':
          description: Current display name and contact revision.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UpdatedContact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/contacts/{contactId}/tags:
    patch:
      operationId: replaceContactTags
      tags: [Contacts]
      summary: Replace a contact's complete tag list
      description: |
        Scope contacts.write. Shares the existing contact editor's endpoint and
        transactional tag writer with verified human callers. Tags are trimmed,
        lowercased, deduplicated and returned in sorted order. An empty list
        clears all tags. At most 50 input tags, each 1–256 characters, are allowed;
        overflow and invalid fields are refused rather than silently truncated.
        Retained tags keep their original application history. Reuse the same
        idempotency key and input to recover a response; a replay reads the
        current list without reapplying an older replacement. No consent, identity
        or message is changed. Receipts retain the platform's 30-day lifetime.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ContactId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceContactTagsInput' }
      responses:
        '200':
          description: Current tags and contact revision.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ReplacedContactTags' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/contacts/{contactId}/attributes:
    patch:
      operationId: updateContactAttributes
      tags: [Contacts]
      summary: Update declared custom fields on a contact
      description: |
        Scope `contacts.write`. Uses the dashboard's owning handler and field
        definitions. A null value clears a field. Undeclared, archived or invalid
        fields are refused atomically. Obtain businessId from GET /v1/workspace;
        it must match the authenticated key's workspace.

        Idempotency-Key is required. Reuse the same key and input after an
        uncertain result. Changed input with the same key returns 409. Retries
        recheck current authority and return the contact's current fields;
        they do not reapply the original patch. Receipts follow the platform's
        idempotency retention policy. Never use a key for a different logical action.
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f-]{36}$'
        - $ref: "#/components/parameters/ContactId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]{1,128}$'
      requestBody:
        required: true
        description: At most 64 KiB of UTF-8 JSON, with no duplicate member names.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactAttributesInput"
      responses:
        "200":
          description: Current custom fields and opaque contact revision.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/UpdatedContactAttributes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The idempotency key was used for different parameters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/dashboard/{businessId}/contacts/consent-history:
    get:
      operationId: getConsentState
      tags: [Contacts]
      summary: Read a contact's current messaging consent decisions
      description: |
        Scope consents.read. The existing consent-history owner supports the fixed
        messaging view for both verified humans and integrations. Returns each
        linked phone/Instagram identity separately, with explicit unknown states
        for purposes without a register entry. No grant is inferred from absence.
        This is an observation, not send eligibility; preview/send recheck policy.
        No history or consent quotations are released. Erased, erasure-pending,
        merged and cross-workspace contacts are not found. Contacts with more than
        100 messaging identities are refused rather than silently truncated.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - name: view
          in: query
          required: true
          schema: { type: string, const: messaging }
        - name: contactId
          in: query
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$' }
      responses:
        '200':
          description: Current messaging consent state, grouped by identity.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContactConsentState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/consents/marketing-opt-in:
    post:
      operationId: recordMarketingOptIn
      tags: [Contacts]
      summary: Verify a customer's current message asking for marketing offers
      description: |
        Scope consents.write or contacts.edit for a verified human. Supply only
        the retained inbound message ID. The shared proof owner verifies an
        explicit request for offers, exact identity/account/conversation binding,
        latest customer message, provider act time and 24-hour freshness. It
        refuses ambiguous text, stale or deleted evidence, inactive sources and
        older grants delivered after a withdrawal. No origin, quotation, source
        or verification flag is accepted. The grant covers marketing on that
        message's channel only. It sends no welcome or other message. This
        explicit business action may apply to a human-managed active thread;
        automated agent/flow calls retain their existing takeover fences.
        Replay reads current consent without reapplying an older grant. Keys
        retain the standard 30-day receipt lifetime. Ineligible retained evidence
        returns verification_failed (422); missing or foreign messages are 404.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordMarketingOptInInput' }
      responses:
        '200':
          description: Current channel-specific marketing decision.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MarketingOptInRegistration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The retained message does not establish a current explicit customer opt-in.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/consents/withdraw:
    post:
      operationId: withdrawConsent
      tags: [Contacts]
      summary: Withdraw one WhatsApp messaging purpose
      description: |
        Scope consents.write. The canonical suppression owner also accepts verified
        human callers with contacts.edit. No contact is created and no grant,
        origin or proof may be supplied. Replays return the current register
        state without overwriting a later verified customer opt-in. Retain the
        original input and key; receipts have the platform's 30-day retention.
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawConsentInput' }
      responses:
        '200':
          description: Current state for the addressed purpose, without recipient details.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ConsentWithdrawal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/dashboard/{businessId}/developer/messaging-settings:
    get:
      operationId: getMessagingConfiguration
      tags: [Messages]
      summary: Discover merchant-managed template aliases and text-purpose bindings
      description: |
