  "/api/v1/platform/subscriptions/{subscriptionId}/businesses/{businessId}/recover":
    post:
      operationId: recoverPlatformSubscriptionReceiver
      tags: [Platform]
      summary: Recover one merchant receiver from a native health pause
      description: |
        Requires platform.subscriptions.manage, the exact original merchant
        grant and the current reviewed health revision. The application receiver
        must remain active with valid current receiver proof ready for activation.
        Refresh proof with verify if necessary; active verification does not
        pause other merchants. Resets only this client's native health pause.
        Cancelled work stays cancelled. Repeat exact intent to observe current
        health without resuming a later pause. A changed intent conflicts.
      security: [{applicationKey: []}]
      parameters:
        - {name: subscriptionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/BusinessId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoverPartnerReceiverInput'}
      responses:
        "200":
          description: Current merchant receiver health. No-store. An old recovered intent never resumes a newer failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PartnerReceiverHealth'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "429": {$ref: '#/components/responses/RateLimited'}
        "500": {$ref: '#/components/responses/InternalError'}
        "503": {$ref: '#/components/responses/Unavailable'}
webhooks:
  developerEvent:
    post:
      operationId: receiveDeveloperEvent
      summary: An event InsideDM posts to your verified, active endpoint
      description: |
        Thin: identifiers only. Verify `X-InsideDM-Signature` over the raw body
        before parsing it (see `docs/public-api/webhooks.md`), deduplicate on
        `X-InsideDM-Event-Id`, and read the resource through `/v1`. Delivery is
        at least once and unordered; answer any 2xx within 5 seconds.
      parameters:
        - $ref: "#/components/parameters/WebhookEvent"
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookDeliveryId"
        - $ref: "#/components/parameters/WebhookAttemptId"
        - $ref: "#/components/parameters/WebhookAttemptNumber"
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/DeveloperChangedEventEnvelope"
                - $ref: "#/components/schemas/MessageDeliveryChangedEventEnvelope"
                - $ref: "#/components/schemas/OperationChangedEventEnvelope"
                - $ref: "#/components/schemas/ApplicationResourceEventEnvelope"
                - $ref: "#/components/schemas/EndpointTestEventEnvelope"
      responses:
        "2XX":
          description: Received. Any 2xx; the body is ignored.
        "410":
          description: Gone — InsideDM pauses the endpoint and stops sending.
        default:
          description: |
            Anything else: 408, 425, 429 and 5xx (and a network failure) are
            retried on a fixed schedule up to eight attempts within 24 hours;
            other 4xx and every 3xx are final. Redirects are never followed.
  endpointVerify:
    post:
      operationId: answerEndpointVerification
      summary: The one-time challenge InsideDM sends when you verify an endpoint
      description: |
        Signed like any delivery. Answer 200 with a JSON body of exactly
        `challenge` (echoed) and `proof` =
        `hex(HMAC-SHA-256(secretBytes, "insidedm.endpoint.verify.v1." + verificationId + "." + challenge))`,
        at most 1 KiB, within 5 seconds, without redirecting.
      parameters:
        - $ref: "#/components/parameters/WebhookSignature"
        - $ref: "#/components/parameters/WebhookVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookVerificationChallenge"
      responses:
        "200":
          description: The proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookVerificationProof"
components:
  securitySchemes:
    applicationKey:
      type: http
      scheme: bearer
      bearerFormat: 'idmp_<16 characters>_<43 characters>'
      description: Server-only application credential. Portfolio endpoints only; never send to a browser.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "idm_<16 characters>_<43 characters> or idmd_<16 characters>_<43 characters>"
      description: |
        `Authorization: Bearer idm_…` — exactly one header, nothing else. A
        key in a query string, a cookie, or a second Authorization header is
        refused.
  headers:
    X-Request-Id:
      description: Our id for this request. Quote it to support.
      schema:
        type: string
        pattern: "^req_[A-Za-z0-9_-]{22}$"
    Retry-After:
      description: Whole seconds to wait before the same request would be admitted.
      schema:
        type: integer
        minimum: 1
    WWW-Authenticate:
      schema:
        type: string
        const: 'Bearer realm="InsideDM Public API", error="invalid_token"'
    Allow:
      schema:
        type: string
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f-]{36}$'
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f-]{36}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]{1,128}$'
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page, 1–100. Default 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        `page.nextCursor` from the previous page, unchanged. Valid for 15
        minutes, for the same key, route, filters and limit.
      schema:
        type: string
        maxLength: 2048
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookEvent:
      name: X-InsideDM-Event
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/DeveloperEventType"
    WebhookEventId:
      name: X-InsideDM-Event-Id
      in: header
      required: true
      description: The event's id — deduplicate on it. A replay carries the same one.
      schema:
        type: string
    WebhookDeliveryId:
      name: X-InsideDM-Delivery-Id
      in: header
      required: true
      description: This event's delivery to this endpoint. A replay carries the same one.
      schema:
        type: string
    WebhookAttemptId:
      name: X-InsideDM-Attempt-Id
      in: header
      required: true
      schema:
        type: string
    WebhookAttemptNumber:
      name: X-InsideDM-Attempt-Number
      in: header
      required: true
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
    WebhookSignature:
      name: X-InsideDM-Signature
      in: header
      required: true
      description: |
        `t=<unix seconds>,v1=<hex HMAC-SHA-256>` — during a secret rotation
        overlap, two `v1=` values (current secret first). Signed over
        `<t>.<raw body>` with the secret's decoded 32 bytes.
      schema:
        type: string
        pattern: "^t=[0-9]+,v1=[0-9a-f]{64}(,v1=[0-9a-f]{64})?$"
    WebhookVersion:
      name: X-InsideDM-Webhook-Version
      in: header
      required: true
      schema:
        type: string
        enum: ["1", "2"]
      description: Version 2 for opt-in operation.changed; existing resource/test events and verification challenges retain version 1.
  responses:
    BadRequest:
      description: "`invalid_request` (the `errors` array names each bad field) or `invalid_cursor`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "`invalid_token` — missing, malformed, unknown, revoked or expired. Never says which."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "`insufficient_scope` — the key is live but lacks this route's scope."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`resource_not_found` — not in this key's workspace, or not there at all."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "The idempotency key belongs to another intent, the resource revision changed, or its current state refuses this action."
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooLarge:
      description: "`response_too_large` — a single item exceeds the 1 MiB response bound."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "`rate_limited` — over the key's or the workspace's budget. Wait `Retry-After` seconds."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: "`internal_error` — ours. Retry with backoff."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: "`dependency_unavailable` — ours, temporarily. Retry with backoff."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
